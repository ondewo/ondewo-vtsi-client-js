name: tests

on:
  push:
    branches:
      - master
      - 'release/**'
    tags:
      - '*'
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout starts with a bare `git init`, and git then prints a multi-line
      # "Using 'master' as the name for the initial branch" hint into every job log. Naming the
      # default up front silences it; master is this repository's default branch anyway.
      - name: Name git's default branch
        run: git config --global init.defaultBranch master

      - uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # The repo is ~95% generated gRPC/protobuf stubs; coverage is gated on the HAND-WRITTEN surface only
      # (the D18 Keycloak offline-token auth provider, auth/offlineTokenProvider.js). The test runs node's
      # built-in test runner under c8 with a 100% line/branch/function coverage gate scoped to that file.
      - name: Unit tests + 100% coverage gate on hand-written auth code
        run: npm test
